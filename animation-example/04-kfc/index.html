<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC</title>
    <link rel="stylesheet" href="reset.css">
    <style>
        body, html {background:#da1e27;}
        header, main {width:1400px; margin:0 auto;}
        header {padding:30px 0;}
        header img {width:100%;}
        main {height:800px; position:relative; display:flex; justify-content:space-between; padding:50px 0 0;}
        main .txt #order {
            background:#fff; border-radius:50px; text-align:center; padding:20px 0;
            display:inline-block; margin-top:50px; font-weight:600;
            width:200px; color:#000;
            transition: width 0.8s, box-shadow 0.8s;
        }
        #sns {position:absolute; left:0; bottom:100px;}
        #sns a {
            display:inline-block; width:40px; margin:0 10px;
            position:relative; top:0;
            transition: transform 0.5s;
        }
        #sns a img {width:100%;}
        #dynamic #btn {display:flex; position:absolute; right:0; bottom:100px;}
        #dynamic #btn a {margin:0 5px;}
        #dynamic #btn a#prev {}
        #dynamic #btn a#next {
            transform: scaleX(-1); /* scaleX(-1): 좌우반전 */
        }
        /* ---------------------------------- */
        #sns a:hover {
            transform: translateY(-30px);
        }
        main .txt #order:hover {
            color: #da1e27;
            width: 280px;
            box-shadow:0 0 20px rgba(255, 251, 0, 0.8);}
        /* ---------------------------------- */
        #wrap main #dynamic {
        }
        #wrap main #dynamic #btn {
        }
        #wrap main #dynamic #btn:hover + #img #big2 {
            display: block;
        }
        #wrap main #dynamic #btn:hover + #img #big {
            display: none;
        }
        #wrap main #dynamic #img {
            position: relative;
            width: 668px; height: 596px;
        }
        #wrap main #dynamic #img img {
            position: absolute;
        }
        #wrap main #dynamic #img #big {}
        #wrap main #dynamic #img #big2 {
            display: none;
        }
    </style>
    <script>
        window.onload=function(){

            

        }//e:onload
    </script>
</head>
<body>
    <div id="wrap">
        <header><img src="images/kfc_header.png" alt=""></header>
        <main>
            <div class="txt">
                <p><img src="images/sub_title.png" alt=""></p>
                <a href="#" id="order">Order Now</a>
            </div>
            <div id="sns">
                <a href="#"><img src="images/facebook.png" alt=""></a>
                <a href="#"><img src="images/twitter.png" alt=""></a>
                <a href="#"><img src="images/instagram.png" alt=""></a>
            </div>
            <div id="dynamic">
                <div id="btn">
                    <a href="#" id="prev"><img src="images/prev_next.png" alt=""></a>
                    <a href="#" id="next"><img src="images/prev_next.png" alt=""></a>
                </div>
                <div id="img">
                    <img src="images/menu1.png" alt="" id="big">
                    <img src="images/menu3.png" alt="" id="big2">
                </div>
            </div>
        </main>
    </div>
</body>
</html>
